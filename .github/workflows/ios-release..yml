name: iOS Build & Deploy to App Store

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: true
        default: '3.24.0'
        type: string

jobs:
  build-and-deploy-ios:
    name: Build IPA & Upload to App Store Connect
    runs-on: macos-latest
    
    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'
          cache: true

      # 3. Get Flutter dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 4. Import Distribution Certificate (.p12)
      - name: Install Apple Distribution Certificate
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      # 5. Install Provisioning Profile
      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      # 6. Build Release IPA
      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # 7. Upload to App Store Connect (Apple ID + App-Specific Password)
      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose
