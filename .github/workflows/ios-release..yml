name: iOS Build & Deploy to App Store

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version (must match pubspec.yaml Dart SDK requirement)'
        required: true
        default: '3.38.5'
        type: string

jobs:
  build-and-deploy-ios:
    name: Build IPA & Upload to App Store Connect
    runs-on: macos-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter/Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Apple Distribution Certificate
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose
