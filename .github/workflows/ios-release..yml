name: iOS Build & Deploy to App Store

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: true
        default: '3.38.5'
        type: string

jobs:
  build-and-deploy-ios:
    name: Build IPA & Upload to App Store Connect
    runs-on: macos-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # DEBUG: Check if secrets exist (length check, no exposure)
      - name: Debug Secrets
        run: |
          echo "Checking secret availability..."
          if [ -n "${{ secrets.IOS_P12_BASE64 }}" ]; then
            echo "IOS_P12_BASE64: FOUND (length ${#SECRET})"
          else
            echo "IOS_P12_BASE64: MISSING OR EMPTY"
          fi
          
          if [ -n "${{ secrets.IOS_P12_PASSWORD }}" ]; then
            echo "IOS_P12_PASSWORD: FOUND"
          else
            echo "IOS_P12_PASSWORD: MISSING OR EMPTY"
          fi
          
          if [ -n "${{ secrets.IOS_PROVISION_BASE64 }}" ]; then
            echo "IOS_PROVISION_BASE64: FOUND"
          else
            echo "IOS_PROVISION_BASE64: MISSING OR EMPTY"
          fi
          
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID: FOUND"
          else
            echo "APPLE_ID: MISSING OR EMPTY"
          fi
          
          if [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]; then
            echo "APPLE_APP_SPECIFIC_PASSWORD: FOUND"
          else
            echo "APPLE_APP_SPECIFIC_PASSWORD: MISSING OR EMPTY"
          fi
        env:
          SECRET: ${{ secrets.IOS_P12_BASE64 }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Apple Distribution Certificate
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose
