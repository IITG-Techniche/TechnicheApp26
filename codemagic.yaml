workflows:
  ios-simulator-build-and-run:
    name: iOS Simulator Build and Run (Debug - No Signing)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Run Flutter tests
        script: flutter test

      - name: Set iOS deployment target to 15.5
        script: |
          sed -i.bak "s/^# platform :ios.*/platform :ios, '15.5'/" ios/Podfile || echo "platform :ios, '15.5'" >> ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build for iOS simulator (debug mode)
        script: flutter build ios --simulator --debug --no-codesign

      - name: Boot iOS Simulator
        script: |
          xcrun simctl boot "iPhone 14"
          open -a Simulator || true

      - name: Install and Launch the App
        script: |
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          xcrun simctl launch booted com.techniche.techniche-app

    artifacts:
      - build/ios/iphonesimulator/Runner.app
