name: techniche26
description: "Techniche Official App 2026"
publish_to: 'none'
version: 1.2.2+11

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  pedometer:
    git:
      url: https://github.com/DhruvGupta21/flutter-plugins
      path: packages/pedometer
  permission_handler: ^12.0.1
  flutter_svg: ^2.0.17
  firebase_core: ^4.1.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  firebase_auth: ^6.1.0
  lottie: ^3.2.2
  upgrader: ^11.5.0
  package_info_plus: ^8.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  location: ^8.0.1
  google_fonts: ^6.3.3
  animated_text_kit: ^4.2.3
  timeline_tile: ^2.0.0
  cloud_firestore: ^6.1.0
  intl: ^0.19.0
  firebase_remote_config: ^6.1.0
  flutter_map_marker_popup: ^7.0.0
  animated_glitch: ^2.0.0+2
  model_viewer_plus: ^1.9.3
  provider: ^6.1.2
  supabase_flutter: ^2.12.0
  flutter_riverpod: ^2.6.1
  flutter_staggered_animations: ^1.1.1
  carousel_slider: ^5.0.0
  webview_flutter: ^4.13.0
  flutter_foreground_task: ^6.3.1

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_html: ^3.0.0
  flutter_lints: ^5.0.0
  
flutter_icons:
  image_path: "icons/playstore-icon.png"
  android: true
  ios: true

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets: 
    - assets/
    - assets/onboarding/
  

  # To add custom fonts to your application, add a fonts section here,
