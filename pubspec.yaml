name: techniche26
description: "Techniche Official App 2026"
publish_to: 'none'
version: 1.2.8+19

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  permission_handler: ^12.0.1
  flutter_svg: ^2.0.17
  firebase_core: ^4.1.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  firebase_auth: ^6.1.0
  lottie: ^3.2.2
  upgrader: ^11.5.0
  package_info_plus: ^8.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  location: ^8.0.1
  google_fonts: ^6.3.3
  animated_text_kit: ^4.2.3
  timeline_tile: ^2.0.0
  cloud_firestore: ^6.1.0
  firebase_app_check: ^0.4.6
  intl: ^0.19.0
  firebase_remote_config: ^6.1.0
  flutter_map_marker_popup: ^7.0.0
  animated_glitch: ^2.0.0+2
  model_viewer_plus: ^1.9.3
  provider: ^6.1.2
  supabase_flutter: ^2.12.0
  flutter_riverpod: ^2.6.1
  flutter_staggered_animations: ^1.1.1
  carousel_slider: ^5.0.0
  webview_flutter: ^4.13.0
  flutter_foreground_task: ^8.14.0
  qr_flutter: ^4.1.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_compass: ^0.8.1
  flutter_map_cache: ^2.0.0+1
  dio_cache_interceptor: ^4.0.6
  http_cache_file_store: ^2.0.1
  path_provider: ^2.1.5
  dio: ^5.9.2
  share_plus: ^12.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_html: ^3.0.0
  flutter_lints: ^5.0.0

flutter_icons:
  image_path: "icons/playstore-icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/hero/
    - assets/hero/meetheads/
    - assets/data/
    - assets/onboarding/
    - assets/ghm/
    - assets/workshops/
    - assets/events/

  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
        - asset: fonts/Orbitron-Bold.ttf
          weight: 700

    - family: General Sans
      fonts:
        - asset: fonts/GeneralSans-Regular.otf
        - asset: fonts/GeneralSans-Medium.otf
          weight: 500
        - asset: fonts/GeneralSans-Semibold.otf
          weight: 600

    - family: Univers
      fonts:
        - asset: fonts/UniversCnBold.ttf
          weight: 700